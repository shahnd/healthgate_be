spring.application.name=healthgate

server.servlet.context-path=/healthgate
server.port=8006

# CORS 설정
com.kh.healthgate.cors.allowed-origins=http://localhost:5173

#요청 Entry point: http://localhost:8006/healthgate

spring.datasource.url=jdbc:mysql://localhost:3306/healthgate_db

#MySQL 아이디, 비밀번호
spring.datasource.username=root
spring.datasource.password=mysql

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway가 스키마 변경을 전담하고 Hibernate는 엔티티와의 일치 여부만 검증합니다.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false

# 파일 업로드 관련 셋팅
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=21MB

# 공용 파일 저장소
com.kh.healthgate.file.root-dir=./data/storage

# 개발용 안전문서 시딩
# 실행 시 true로 덮어쓰면 data/documents의 PDF를 시딩합니다.
com.kh.healthgate.safety.seed.enabled=false
com.kh.healthgate.safety.seed.directory=./data/documents

 
# 파일 저장 경로 설정 
 file.upload-dir=C:\\healthgate\\notice_upfiles\\

# 공공데이터포털
com.kh.healthgate.opendata.base-url=https://apis.data.go.kr
com.kh.healthgate.opendata.service-key=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

# Spring AI
spring.ai.google.genai.api-key=AQ.XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
spring.ai.google.genai.embedding.api-key=${spring.ai.google.genai.api-key}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite

com.kh.healthgate.ai.vector-store-file-path=./data/simple-vector-store.json
com.kh.healthgate.ai.pipeline-version=pdf-page-v1
com.kh.healthgate.ai.embedding-model=google-genai-embedding

# Gmail SMTP 이메일 알림 발송
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
