spring.application.name=healthgate

server.servlet.context-path=/healthgate
server.port=8006

# CORS 설정
com.kh.healthgate.cors.allowed-origins=http://localhost:5173

#요청 Entry point: http://localhost:8006/healthgate

spring.datasource.url=jdbc:mysql://localhost:3306/healthgate_db

#MySQL 아이디, 비밀번호
spring.datasource.username=root
spring.datasource.password=mysql

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Hibernate가 자동으로 감지하는 설정
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 파일 업로드 관련 셋팅
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#더미데이터 적용하려면 ddl-auto create로 바꾼 후 아래 코드 주석 풀고 스프링 부트 재시작하시면 됩니다.
# spring.sql.init.mode=always
# spring.jpa.defer-datasource-initialization=true

# 공공데이터포털
com.kh.healthgate.opendata.base-url=https://apis.data.go.kr
com.kh.healthgate.opendata.service-key=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

# Spring AI
spring.ai.google.genai.api-key=AQ.XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
spring.ai.google.genai.embedding.api-key=${spring.ai.google.genai.api-key}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite

com.kh.healthgate.ai.vector-store-file-path=./data/simple-vector-store.json
com.kh.healthgate.ai.pipeline-version=pdf-page-v1
com.kh.healthgate.ai.embedding-model=google-genai-embedding

# Gmail SMTP 이메일 알림 발송
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true