spring.application.name=healthgate

server.servlet.context-path=/healthgate
server.port=8006

#요청 Entry point: http://localhost:8006/healthgate

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/healthgate_db

#MySQL 아이디, 비밀번호
spring.datasource.username=root
spring.datasource.password=mysql

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 파일 업로드 관련 셋팅
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#더미데이터 적용하려면 ddl-auto create로 바꾼 후 아래 코드 주석 풀고 스프링 부트 재시작하시면 됩니다.
# spring.sql.init.mode=always
# spring.jpa.defer-datasource-initialization=true

#test

# 파일 스토리지
com.kh.healthgate.file.root-dir=./data/storage

# 공공데이터포털
com.kh.healthgate.opendata.base-url=https://apis.data.go.kr
com.kh.healthgate.opendata.service-key=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

# Spring AI
spring.ai.google.genai.api-key=AQ.XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
spring.ai.google.genai.embedding.api-key=${spring.ai.google.genai.api-key}
spring.ai.google.genai.chat.model=gemini-3.5-flash-lite

com.kh.healthgate.ai.vector-store-file-path=./data/simple-vector-store.json