# 모든 테스트가 외부 MySQL과 Flyway 대신 독립된 H2 스키마를 사용합니다.
spring.datasource.url=jdbc:h2:mem:healthgate;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.flyway.enabled=false

com.kh.healthgate.safety.seed.enabled=false
com.kh.healthgate.file.root-dir=${java.io.tmpdir}/healthgate-test-storage
file.upload-dir=${java.io.tmpdir}/healthgate-test-notice-files

com.kh.healthgate.opendata.base-url=http://localhost
com.kh.healthgate.opendata.service-key=test-service-key
com.kh.healthgate.ai.vector-store-file-path=${java.io.tmpdir}/healthgate-test-vector-store.json

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
