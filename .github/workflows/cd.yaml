name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Test
        env:
          SPRING_PROFILES_ACTIVE: test
        run: mvn clean test

      - name: Build
        run: mvn package -DskipTests

      - name: Transfer
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "target/*.jar"
          target: "~/uploads"
          strip_components: 1

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /opt/healthgate

            mv ~/uploads/*.jar app.jar

            sudo systemctl restart healthgate
            sudo systemctl is-active healthgate

      - name: Health Check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            count=0

            while [ "$count" -lt 60 ]; do
              if curl -fs http://localhost:8006/healthgate/actuator/health > /dev/null; then
                echo "Application is healthy"
                exit 0
              fi

              count=$((count + 1))
              sleep 3
            done

            echo "Application health check failed"
            exit 1
